  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">Ümit Sural</a>

  <div class="nav-links">
    <a href="works.html">Works</a>
    <a href="journal.html">Journal</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<main class="artwork-page">

  <section class="artwork-layout">

    <aside class="artwork-info">

      <div>
        <p class="archive-label">Muscle Memory</p>

        <h1>Safe House</h1>
      </div>

      <div class="artwork-meta">

        <p>
          2025<br>
          Acrylic on paper<br>
          30 × 42 cm
        </p>

        <p class="artwork-text">
          Part of the Muscle Memory series, exploring protection, control, memory and the fragile boundaries between safety and containment.
        </p>

      </div>

      <div class="artwork-navigation">
        <a href="muscle-memory.html">Back to collection</a>
      </div>

    </aside>

    <section class="artwork-slider">

      <img src="assets/images/muscle-memory/safe-house-main.webp" alt="Safe House by Ümit Sural" class="active">

      <img src="assets/images/muscle-memory/safe-house-detail-01.webp" alt="">
      <img src="assets/images/muscle-memory/safe-house-detail-02.webp" alt="">
      <img src="assets/images/muscle-memory/safe-house-detail-03.webp" alt="">

      <div class="slider-controls">
        <button id="prevBtn">Previous</button>
        <span id="sliderCount">01 / 04</span>
        <button id="nextBtn">Next</button>
      </div>

    </section>

  </section>

</main>

<script>
const slides = document.querySelectorAll('.artwork-slider img');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('sliderCount');

let currentSlide = 0;

function updateSlider() {
  slides.forEach(slide => slide.classList.remove('active'));
  slides[currentSlide].classList.add('active');

  const current = String(currentSlide + 1).padStart(2, '0');
  const total = String(slides.length).padStart(2, '0');

  counter.textContent = `${current} / ${total}`;
}

nextBtn.addEventListener('click', () => {
  currentSlide++;

  if (currentSlide >= slides.length) {
    currentSlide = 0;
  }

  updateSlider();
});

prevBtn.addEventListener('click', () => {
  currentSlide--;

  if (currentSlide < 0) {
    currentSlide = slides.length - 1;
  }

  updateSlider();
});

updateSlider();
</script>

</body>
</html>
